name: ci

on:
  push:
    branches: [main]
  pull_request:

# Keep the backend and clients gate jobs in sync with the copies in release.yml
# (enforced by server/tests/test_workflow_parity.py).
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: balu
          POSTGRES_PASSWORD: balu
          POSTGRES_DB: balu_test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Wait for Postgres
        # The service container races the job when its image is already cached
        # on the runner (first run passed only because the pull was slow).
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/postgres/5432) 2>/dev/null && exit 0
            sleep 1
          done
          echo "postgres not reachable after 60s" >&2
          exit 1
      - name: Tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql+psycopg://balu:balu@postgres:5432/balu_test
        run: |
          uv sync --frozen
          uv run ruff check . ../tools/e2e
          uv run pytest -q

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build, typecheck, lint, test
        run: |
          pnpm -r build
          pnpm -r typecheck
          pnpm -r lint
          pnpm -r test
