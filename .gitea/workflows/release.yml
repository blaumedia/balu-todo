name: release

# Tag vX.Y.Z → build the self-hosting image (web client baked in) for amd64 and
# arm64 and push it to two registries:
#
#   * the Gitea packages registry as <owner>/balu:<version> and :latest - what
#     the deployments here pull. The host comes from the `REGISTRY_HOST` Actions
#     variable (org or repo level) so this file carries no forge hostname.
#   * GHCR as ghcr.io/blaumedia/balu-todo:<version> and :latest - what the
#     public README tells people to `docker pull`. Needs the `GHCR_TOKEN` secret
#     (a *classic* PAT with write:packages; fine-grained tokens cannot grant it)
#     and, if the token owner is not the org, a `GHCR_USER` variable. Without
#     the secret the GHCR tags are simply not built or pushed - the run still
#     publishes to Gitea rather than failing.
#
# Image tags are the version - rollback is a re-point, never a rebuild.
#
# If the test gate fails on a tag: for a flake, re-run the workflow; for a real
# failure, fix it and cut the next patch version. Never move a pushed tag (it may
# already be mirrored). Before the first real tag, run a dispatch dry run from `main`
# (see below) to exercise the gate and the credentials.
#
# Can also be dispatched manually. A dispatch is a **dry run by default**: it
# authenticates and builds, then pushes nothing - the way to prove credentials
# and variables still resolve without burning a version number. Note that a run
# always executes the workflow file *as of its ref*, so dispatch from `main`
# (or a tag created after this commit) to exercise the current one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify login and build only - push nothing"
        type: boolean
        default: true

env:
  GHCR_IMAGE: ghcr.io/blaumedia/balu-todo
  PLATFORMS: linux/amd64,linux/arm64

# Keep the backend and clients gate jobs in sync with the copies in ci.yml
# (enforced by server/tests/test_workflow_parity.py).
jobs:
  # Test gate: the same checks ci.yml runs on main, repeated here because a tag
  # can be pushed from a commit whose CI run failed or never finished. The image
  # job needs both, so nothing is published from untested code.
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: balu
          POSTGRES_PASSWORD: balu
          POSTGRES_DB: balu_test
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Wait for Postgres
        # The service container races the job when its image is already cached
        # on the runner (first run passed only because the pull was slow).
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/postgres/5432) 2>/dev/null && exit 0
            sleep 1
          done
          echo "postgres not reachable after 60s" >&2
          exit 1
      - name: Tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql+psycopg://balu:balu@postgres:5432/balu_test
        run: |
          uv sync --frozen
          uv run ruff check . ../tools/e2e
          uv run pytest -q

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build, typecheck, lint, test
        run: |
          pnpm -r build
          pnpm -r typecheck
          pnpm -r lint
          pnpm -r test

  image:
    needs: [backend, clients]
    runs-on: release
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version, image name and publish mode
        # A tag push always publishes. A dispatch publishes only when dry_run is
        # explicitly false *and* it was dispatched from a v* tag - dispatching
        # from a branch would otherwise version the image after the branch and
        # move :latest onto untagged code.
        run: |
          echo "IMAGE=${{ vars.REGISTRY_HOST }}/${{ github.repository_owner }}/balu" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "PUBLISH=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
                echo "PUBLISH=1" >> "$GITHUB_ENV"
                ;;
              *)
                echo "dry_run=false is only allowed from a v* tag (got $GITHUB_REF)" >&2
                exit 1
                ;;
            esac
          else
            echo "VERSION=dryrun-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"
            echo "PUBLISH=0" >> "$GITHUB_ENV"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        # Multi-platform images cannot be produced by plain `docker build`, and
        # they cannot be loaded into the local image store either - buildx has
        # to push the manifest list itself, hence the single build+push step.
        uses: docker/setup-buildx-action@v3
      - name: Login to registry
        # The built-in GITHUB_TOKEN cannot authenticate against the packages
        # registry - use the org Actions secret (a PAT with write:package),
        # same as the other repos on this forge. This step runs on dry runs too;
        # verifying it is the point of them.
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "${{ vars.REGISTRY_HOST }}" -u "${{ github.actor }}" --password-stdin
      - name: Login to GHCR
        # Not fatal when unconfigured: a fork, or this repo before the token is
        # in place, should still cut releases to the forge registry.
        run: |
          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "GHCR_TOKEN is not set - skipping the public $GHCR_IMAGE tags." >&2
            echo "GHCR=0" >> "$GITHUB_ENV"
            exit 0
          fi
          GHCR_USER="${{ vars.GHCR_USER }}"
          [ -n "$GHCR_USER" ] || GHCR_USER="${{ github.repository_owner }}"
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          echo "GHCR=1" >> "$GITHUB_ENV"
      - name: Build and push
        # Push is guarded in shell rather than with `if:` on purpose - an
        # expression that evaluates unexpectedly would publish from a dry run,
        # which is the one outcome this must never have. A dry run still builds
        # every platform; `type=cacheonly` just throws the result away.
        run: |
          TAGS="-t $IMAGE:$VERSION"
          [ "$GHCR" = "1" ] && TAGS="$TAGS -t $GHCR_IMAGE:$VERSION"
          if [ "$PUBLISH" = "1" ]; then
            TAGS="$TAGS -t $IMAGE:latest"
            [ "$GHCR" = "1" ] && TAGS="$TAGS -t $GHCR_IMAGE:latest"
            OUTPUT="--push"
          else
            OUTPUT="--output=type=cacheonly"
            echo "Dry run: authenticated, building $VERSION for $PLATFORMS. Pushing nothing."
          fi
          docker buildx build \
            -f server/Dockerfile \
            --platform "$PLATFORMS" \
            --build-arg SKIP_WEB=0 \
            --build-arg VERSION="$VERSION" \
            $TAGS $OUTPUT .
      - name: Publish the GitHub release
        # Release notes have to live where people can actually read them: this
        # forge is not reachable from outside, so the mirror is the only public
        # face. Last step on purpose - a release that points at images which
        # failed to push would be worse than no release.
        #
        # Reuses GHCR_TOKEN deliberately: it is a classic PAT whose `repo`
        # scope already covers releases on the mirror, so this adds no second
        # credential to rotate. The token is passed through `env` rather than
        # interpolated into the script, so it never appears in the run log.
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GH_REPO: blaumedia/balu-todo
        run: |
          if [ "$PUBLISH" != "1" ]; then
            echo "Dry run: not touching GitHub releases."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "GHCR_TOKEN is not set - skipping the GitHub release." >&2
            exit 0
          fi
          python3 .gitea/scripts/github_release.py
