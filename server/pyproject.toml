[project]
name = "balu-server"
version = "1.3.0"
description = "Balu — self-hostable todo app backend (FastAPI sync engine)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: FastAPI's Depends()-in-defaults is the intended idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; don't fight its formatting.
"alembic/versions/*" = ["E501", "W291", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
