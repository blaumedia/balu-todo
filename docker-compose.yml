name: balu

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: balu
      POSTGRES_PASSWORD: ${BALU_DB_PASSWORD:-balu}
      POSTGRES_DB: balu
    volumes:
      - balu-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balu -d balu"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://balu:${BALU_DB_PASSWORD:-balu}@db:5432/balu
      SECRET_KEY: ${BALU_SECRET_KEY:-dev-secret-change-me}
      BALU_ALLOW_REGISTRATION: ${BALU_ALLOW_REGISTRATION:-true}
    ports:
      - "${BALU_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  balu-db:
