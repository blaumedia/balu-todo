name: balu

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: balu
      POSTGRES_PASSWORD: ${BALU_DB_PASSWORD:?set BALU_DB_PASSWORD in .env — see .env.example}
      POSTGRES_DB: balu
    volumes:
      - balu-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balu -d balu"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        SKIP_WEB: "0"
    environment:
      DATABASE_URL: postgresql+psycopg://balu:${BALU_DB_PASSWORD:?set BALU_DB_PASSWORD in .env — see .env.example}@db:5432/balu
      SECRET_KEY: ${BALU_SECRET_KEY:?set BALU_SECRET_KEY in .env — see .env.example}
      BALU_ALLOW_REGISTRATION: ${BALU_ALLOW_REGISTRATION:-true}
      BALU_CORS_ORIGINS: ${BALU_CORS_ORIGINS:-}
    ports:
      - "${BALU_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  balu-db:
